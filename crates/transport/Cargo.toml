[package]
name = "zwen-transport"
version = "0.0.3"
edition = "2024"
[dependencies]
zwen-core = {path="../core"}
reqwest = {version="=0.13.5",default-features=false,features=["json","stream","native-tls"]}
tokio = {version="=1.54.1",features=["sync","time","rt","net","macros"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
chrono = {version="=0.4.45",default-features=false,features=["std"]}
