[package]
name = "zwen-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zwen"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop-smoke = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
zwen-core = { path = "../crates/core" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

zwen-transport = { path = "../crates/transport" }
tokio = { version = "=1.54.1", features = ["sync", "time", "rt", "net"] }
base64 = "=0.23.1"
rusqlite = { version = "=0.41.1", features = ["limits"] }
zbus = "=5.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri uses this same locked crate; enable SNI activation events on Linux.
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"] }
libc = "=0.2.191"
gtk = "=0.18.2"
libloading = "=0.7.4"
