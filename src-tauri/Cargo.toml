[package]
name = "zwen-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zwen"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop-smoke = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
zwen-core = { path = "../crates/core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

zwen-transport = { path = "../crates/transport" }
tokio = { version = "=1.54.1", features = ["sync", "time", "rt", "net"] }
base64 = "=0.23.1"
zbus = "=5.19.0"
