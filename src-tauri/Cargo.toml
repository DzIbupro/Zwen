[package]
name = "study-assistant-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "study-assistant"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop-smoke = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
study-assistant-core = { path = "../crates/core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
